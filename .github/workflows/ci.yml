name: CI

# This repository holds specification documents, not application source. CI
# therefore guards the two things that can silently rot: the integrity rules the
# database design depends on, and the cross-references between the documents.
#
# The verification suite is Kotlin, matching the stack the blueprint specifies.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify schema integrity rules
        # Executes db/schema.sql against a real SQLite engine and asserts that
        # the invariants the design depends on are enforced by SQLite itself,
        # so a migration cannot silently drop a constraint.
        run: ./gradlew :tools:verification:test --tests '*SchemaInvariantsTest'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-test-report
          path: tools/verification/build/reports/tests/test

  docs:
    name: Document cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check relative links and heading anchors
        run: ./gradlew :tools:verification:test --tests '*DocumentLinksTest'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-test-report
          path: tools/verification/build/reports/tests/test
